<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' media: data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>IskraLauncher</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="tb-left">
        <span class="logo" id="logo" data-icon="logo" title="IskraLauncher" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 1.6l2.4 6.1 6.5.4-5 4.2 1.7 6.3L12 21.3 6.4 24.9l1.7-6.3-5-4.2 6.5-.4z"/></svg>
        </span>
        <button class="icon-btn" id="btnSettings" data-icon="settings" data-icon-tint title="Настройки" data-i18n-title="titlebar.settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M13.7654 2.15224C13.3978 2 12.9319 2 12 2C11.0681 2 10.6022 2 10.2346 2.15224C9.74457 2.35523 9.35522 2.74458 9.15223 3.23463C9.05957 3.45834 9.0233 3.7185 9.00911 4.09799C8.98826 4.65568 8.70226 5.17189 8.21894 5.45093C7.73564 5.72996 7.14559 5.71954 6.65219 5.45876C6.31645 5.2813 6.07301 5.18262 5.83294 5.15102C5.30704 5.08178 4.77518 5.22429 4.35436 5.5472C4.03874 5.78938 3.80577 6.1929 3.33983 6.99993C2.87389 7.80697 2.64092 8.21048 2.58899 8.60491C2.51976 9.1308 2.66227 9.66266 2.98518 10.0835C3.13256 10.2756 3.3397 10.437 3.66119 10.639C4.1338 10.936 4.43789 11.4419 4.43786 12C4.43783 12.5581 4.13375 13.0639 3.66118 13.3608C3.33965 13.5629 3.13248 13.7244 2.98508 13.9165C2.66217 14.3373 2.51966 14.8691 2.5889 15.395C2.64082 15.7894 2.87379 16.193 3.33973 17C3.80568 17.807 4.03865 18.2106 4.35426 18.4527C4.77508 18.7756 5.30694 18.9181 5.83284 18.8489C6.07289 18.8173 6.31632 18.7186 6.65204 18.5412C7.14547 18.2804 7.73556 18.27 8.2189 18.549C8.70224 18.8281 8.98826 19.3443 9.00911 19.9021C9.02331 20.2815 9.05957 20.5417 9.15223 20.7654C9.35522 21.2554 9.74457 21.6448 10.2346 21.8478C10.6022 22 11.0681 22 12 22C12.9319 22 13.3978 22 13.7654 21.8478C14.2554 21.6448 14.6448 21.2554 14.8477 20.7654C14.9404 20.5417 14.9767 20.2815 14.9909 19.902C15.0117 19.3443 15.2977 18.8281 15.781 18.549C16.2643 18.2699 16.8544 18.2804 17.3479 18.5412C17.6836 18.7186 17.927 18.8172 18.167 18.8488C18.6929 18.9181 19.2248 18.7756 19.6456 18.4527C19.9612 18.2105 20.1942 17.807 20.6601 16.9999C21.1261 16.1929 21.3591 15.7894 21.411 15.395C21.4802 14.8691 21.3377 14.3372 21.0148 13.9164C20.8674 13.7243 20.6602 13.5628 20.3387 13.3608C19.8662 13.0639 19.5621 12.558 19.5621 11.9999C19.5621 11.4418 19.8662 10.9361 20.3387 10.6392C20.6603 10.4371 20.8675 10.2757 21.0149 10.0835C21.3378 9.66273 21.4803 9.13087 21.4111 8.60497C21.3592 8.21055 21.1262 7.80703 20.660         </button>
      </div>
      <div class="tb-right">
        <button class="icon-btn tb-min" id="btnMin" data-icon="minimize" data-icon-tint title="Свернуть" data-i18n-title="titlebar.minimize">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2" ry="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 11l4-4m0 0h-3m3 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn tb-close" id="btnClose" data-icon="close" data-icon-tint title="Закрыть" data-i18n-title="titlebar.close">
          <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <main class="content">
      <aside class="sidebar" id="sidebar"></aside>

      <section class="stage">
        <div class="preview">
          <img id="previewImg" alt="" />
          <div class="preview-empty" id="previewEmpty" data-i18n="preview.empty">Нет выбранной игры</div>
        </div>
        <div class="playbar">
          <button class="play-btn" id="btnPlay" type="button">
            <span data-i18n="play">ИГРАТЬ</span>
          </button>
        </div>
      </section>
    </main>
  </div>

  <div class="overlay hidden" id="settings">
    <div class="panel">
      <div class="panel-head">
        <h2><span data-i18n="settings.title">Настройки</span> <span class="version-tag" id="appVersion"></span></h2>
        <button class="icon-btn" id="btnCloseSettings" title="Закрыть" data-i18n-title="common.close">
          <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="panel-body">
        <section class="block">
          <h3 data-i18n="settings.colors.heading">Цвета</h3>
          <label class="field"><span data-i18n="settings.colors.titleColor">Название выбранной игры</span><input type="color" id="colTitle" /></label>
          <label class="field"><span data-i18n="settings.colors.playColor">Кнопка «Играть»</span><input type="color" id="colPlay" /></label>
        </section>

        <section class="block">
          <h3 data-i18n="settings.language.heading">Язык</h3>
          <div class="field">
            <span></span>
            <div class="row-actions">
              <select class="btn" id="selLanguage"></select>
            </div>
          </div>
        </section>

        <section class="block">
          <h3 data-i18n="settings.folders.heading">Папки</h3>
          <div class="field">
            <span></span>
            <div class="row-actions">
              <button class="btn" id="btnOpenDir" type="button" data-i18n="settings.folders.launcherDir">Папка лаунчера</button>
              <button class="btn" id="btnOpenImages" type="button" data-i18n="settings.folders.imagesDir">Папка картинок</button>
            </div>
          </div>
        </section>

        <section class="block">
          <h3 data-i18n="settings.list.heading">Список</h3>
          <div class="list-editor" id="listEditor"></div>
        </section>

        <section class="block">
          <h3 data-i18n="settings.addGame.heading">Добавить игру</h3>
          <label class="field"><span data-i18n="settings.addGame.name">Название</span><input type="text" id="newName" placeholder="PORTAL 2" /></label>
          <label class="field"><span data-i18n="settings.addGame.url">Ссылка ярлыка</span><input type="text" id="newUrl" placeholder="steam://rungameid/620" /></label>
          <div class="field">
            <span data-i18n="settings.addGame.image">Картинка</span>
            <div class="row-actions">
              <button class="btn" id="btnPickImg" type="button" data-i18n="settings.addGame.pickFile">Выбрать файл…</button>
              <span class="muted" id="newImgName" data-i18n="common.notSelected">не выбрано</span>
              <button class="btn primary" id="btnAddGame" type="button" data-i18n="settings.addGame.add">Добавить игру</button>
            </div>
          </div>
        </section>

        <section class="block">
          <h3 data-i18n="settings.addSeparator.heading">Добавить разделитель</h3>
          <label class="field"><span data-i18n="settings.addSeparator.name">Название</span><input type="text" id="newSepName" placeholder="ЛЮБИМЫЕ" data-i18n-placeholder="settings.addSeparator.namePlaceholder" /></label>
          <div class="field">
            <span data-i18n="settings.addSeparator.color">Цвет</span>
            <div class="row-actions">
              <input type="color" id="newSepColor" value="#37c0e8" />
              <button class="btn primary" id="btnAddSep" type="button" data-i18n="settings.addSeparator.add">Добавить</button>
            </div>
          </div>
        </section>
      </div>

      <div class="panel-foot">
        <button class="btn primary" id="btnDone" type="button" data-i18n="settings.done">Готово</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="notice">
    <div class="notice-box">
      <p id="noticeText"></p>
      <div class="notice-actions">
        <button class="btn" id="noticeCancel" type="button" data-i18n="notice.cancel">Отмена</button>
        <button class="btn primary" id="noticeOk" type="button" data-i18n="notice.ok">ОК</button>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
